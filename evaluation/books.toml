# The evaluation set of galley-eval (docs/specs/evaluation.md, section 3).
#
# Each book is an Internet Archive scan and the Project Gutenberg edition
# that Distributed Proofreaders made from it. Page indices count from 0 in
# the PDF. `exclude_pages` are the pages without a text layer, with which
# `galley2epub run` succeeded on 15 November 2026, but the plates (Stubbs
# 9, 11, 52 and 54), which analyze takes since 16 November 2026, and the
# pages with one that analyze's plate rule takes wrongly
# (docs/specs/plates.md, section 2). The contents pages are those of the
# printed table of contents, found on 16 November 2026 by "CONTENTS" or
# "TABLE DES MATIERES" at the top of the page and checked by reading each
# page's text layer. galley-eval
# writes `exclude_pages`, `contents_pages` and `plate_pages`, each an empty
# list when a book has none, into the book.toml it gives galley
# (architecture section 6). `html_sha256` is that of
# the HTML file downloaded on 15 November 2026, for which the rules and
# counts were written. `expected_counts` were counted by hand in the HTML,
# with a search for each class and href, never by running the reader;
# `body_pages` is the body range, on which the headings are scored, as
# docs/specs/evaluation.md, section 3, gives it;
# `first_tokens` are the first five words of the body, read in the HTML. The reading rules change the defaults of
# tools/galley-eval/src/galley_eval/rules.py, which are those of the spec's
# table in section 4.

[[book]]
name = "haskins"
gutenberg_number = 72514
archive_id = "normansineuropea00hask"
title = "The Normans in European History"
authors = ["Charles Homer Haskins"]
language = "en"
exclude_pages = [0, 3, 4, 5, 7, 11, 15, 265, 274, 276, 279]
contents_pages = [14]
body_pages = [16, 279]
html_sha256 = "d88ef036c5def555a899a2df51aea1d337cd2583ca9ae5d154c06185ed552ea7"
expected_counts = { notes = 72, margin_notes = 0, note_references = 72, page_anchors = 260, headings = 21, first_tokens = ["THE", "NORMANS", "IN", "EUROPEAN", "HISTORY"] }

[book.rules.add]
# Each note is a div.footnote whose label a.label holds the pairing id.
note = ["div.footnote"]

[[book]]
name = "stubbs"
gutenberg_number = 70828
archive_id = "earlyplantagenet01stub"
title = "The Early Plantagenets"
authors = ["William Stubbs"]
language = "en"
# Pages 322 to 337, the publisher's lists after the text, are excluded too:
# the heading rule takes their lines for headings (structure spec section
# 27, point 4, settled on 17 November 2026). The reference ends where they
# begin, at the anchor of printed page 301, so that both sides leave them
# out (docs/specs/evaluation.md, section 3); the expected counts are those
# before it, 306 of the HTML's 322 page anchors and 35 of its 37 headings.
exclude_pages = [0, 2, 3, 4, 5, 8, 10, 53, 55, 322, 323, 324, 325, 326, 327, 328, 329, 330, 331, 332, 333, 334, 335, 336, 337, 338, 339, 340, 341, 342, 343]
contents_pages = [14, 15, 16]
body_pages = [18, 321]
reference_ends_at = "Page_301"
html_sha256 = "0c026dfc971d6fe8e8e55e00aaaa6bd3e4c109095011836c6cb411e24304b0dc"
expected_counts = { notes = 0, margin_notes = 467, note_references = 0, page_anchors = 306, headings = 35, first_tokens = ["Epochs", "of", "Modern", "History", "EDITED"] }

[book.rules.add]
# The chapter titles are p.ph3, not h1-h6.
heading = ["p.ph3"]
# The page column of the table of contents follows the title with no space.
separate = ["span.float-right"]
# A chapter opens with its label, a div.chapter holding an h2, then its
# title, a p.ph3; the quote right after the title is its summary.
summary_after = ["div.chapter"]

[[book]]
name = "domesday"
gutenberg_number = 43255
archive_id = "domesdaybook00maituoft"
title = "Domesday Book and Beyond"
authors = ["Frederic William Maitland"]
language = "en"
exclude_pages = [0, 1, 2, 3, 5, 6, 7, 38, 41, 554, 555, 557]
contents_pages = [14, 15, 16, 17, 18, 19, 20]
# The transcriber put each margin note at the start of its paragraph.
margin_notes_moved = true
body_pages = [22, 552]
html_sha256 = "91163a068f2249c4c199b7ab9f725976b803a6eedb718a2e39206a8ac32743ea"
expected_counts = { notes = 1729, margin_notes = 593, note_references = 1731, page_anchors = 537, headings = 28, first_tokens = ["DOMESDAY", "BOOK", "AND", "BEYOND", "THREE"] }

[book.rules.replace]
# Gutenberg's own paragraph, table and transcriber's note come before the title.
start = ["h1"]

[book.rules.add]
# Every note is a p inside the one div.footnote; a note starts at each p
# that holds an id a note reference points to.
notes_section = ["div.footnote"]

[[book]]
name = "mariejol"
gutenberg_number = 36315
archive_id = "catherinedemedic00mariuoft"
title = "Catherine de Médicis"
authors = ["Jean H. Mariéjol"]
language = "fr"
# 1, 2, 457 and 458 have a text layer: marbled endpapers, an endpaper and
# the library's card pocket.
exclude_pages = [0, 1, 2, 3, 4, 5, 17, 449, 451, 453, 454, 455, 456, 457, 458]
contents_pages = [450]
# Gutenberg leaves out the bibliography.
not_in_reference = [14, 15, 16]
body_pages = [18, 448]
html_sha256 = "33f2ca44a5a04b289494dd378f7b97b93806849edc6440b3383700517acecbee"
expected_counts = { notes = 1432, margin_notes = 0, note_references = 1432, page_anchors = 0, headings = 34, first_tokens = ["Jean-H.", "MARIÉJOL", "Professeur", "à", "la"] }

[book.rules.add]
# Each note is a blockquote.footnote after its paragraph.
note = ["blockquote.footnote"]
# Gutenberg's label of each note and its link back to the reference. The
# label of note 230 has no colon.
drop_text = ['Note \d+:?', '\(retour\)']

[book.rules.replace]
# The references point to #footnoteN; the links back point to #footnotetagN.
note_reference = ['#footnote\d+']
