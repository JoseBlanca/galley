[project]
name = "galley"
version = "0.1.0"
description = "Turns the PDF of a mostly-text book into an EPUB"
readme = "README.md"
authors = [
    { name = "Jose Blanca", email = "jblanca@upv.es" }
]
requires-python = ">=3.15"
dependencies = [
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "pypdfium2>=5.15.2",
    "pytesseract>=0.3.13",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
