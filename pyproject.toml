[project]
name = "galley"
version = "0.1.0"
description = "Turns the PDF of a mostly-text book into an EPUB"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jose Blanca", email = "jblanca@upv.es" }
]
requires-python = ">=3.15"
dependencies = [
    "gilguard==0.2.0",
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "pypdfium2>=5.15.2",
]

[project.scripts]
galley2epub = "galley.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "galley-eval",
    "pytest==9.2.0",
    "pytest-run-parallel==0.10.0",
    "pytest-timeout==2.4.0",
    "ruff==0.17.5",
    "ty==0.0.104",
]

[tool.uv]
required-version = ">=0.13.7"

# The evaluation tool (docs/specs/evaluation.md, section 9) is a second
# package of the repository, a development tool that galley never imports.
[tool.uv.workspace]
members = ["tools/galley-eval"]

[tool.uv.sources]
galley-eval = { workspace = true }

[tool.ruff]
# Markdown code blocks in specs and skills are sketches, not code to format.
extend-exclude = ["*.md"]
# galley_eval is first-party code too, for the sorting of imports.
src = ["src", "tools/galley-eval/src"]

[tool.ruff.lint]
# Ruff >= 0.16 already enables about 400 rules by default (B, UP, RUF, SIM,
# FURB, PL, I, part of PT and TC). These turn rules of the coding skill into
# lint errors:
extend-select = [
    "ANN",     # every function annotated
    "ARG",     # unused arguments
    "BLE",     # no blind except
    "C90",     # functions too complex to review
    "EM",      # exception messages built before raise
    "FBT",     # no bool parameters
    "PLR2004", # thresholds are named constants
    "PT",      # all pytest-style rules
    "PTH",     # pathlib
    "S110",    # no try/except/pass
    "S112",    # no try/except/continue
    "SIM105",  # no contextlib.suppress in place of a handled error
    "RET",     # return consistency
    "T20",     # no print outside the CLI
    "TID251",  # banned APIs, below
    "TRY",     # raise from, no bare re-raise patterns
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004", "FBT"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Not needed on 3.14+: annotations are deferred (PEP 649/749)."

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ty.environment]
python-version = "3.15"

[tool.ty.rules]
all = "error"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests", "tools/galley-eval/tests"]
addopts = ["-ra", "--import-mode=importlib", "-p", "gilguard", "-m", "not whole_book and not vision_model", "--durations=5"]
strict = true
# A unit test takes milliseconds and an excerpt test about a second; a test
# that needs more is a whole_book test or a defect.
timeout = "30"
# The limit is for a test's own body: the session fixture that runs every
# excerpt through the pipeline takes about 30 s alone, more under load.
timeout_func_only = true
# Every warning is an error, and with it the RuntimeWarning that CPython
# prints when an extension turns the GIL back on.
filterwarnings = ["error"]
markers = [
    "whole_book: runs on whole books from samples/ (GALLEY_SAMPLES or the main checkout); excluded by default, run with -m whole_book",
    "tesseract: needs the tesseract binary",
    "pandoc: needs the pandoc binary",
    "epubcheck: needs epubcheck, a development tool (brew install epubcheck)",
    "vision_model: calls a vision model in LM Studio on this machine (docs/specs/correct.md); excluded by default, run with -m vision_model",
]
