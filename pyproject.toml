[project]
name = "galley"
version = "0.1.0"
description = "Turns the PDF of a mostly-text book into an EPUB"
readme = "README.md"
authors = [
    { name = "Jose Blanca", email = "jblanca@upv.es" }
]
requires-python = ">=3.15"
dependencies = [
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "pypdfium2>=5.15.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-run-parallel==0.10.0",
    "pytest-timeout==2.4.0",
    "ruff==0.17.5",
    "ty==0.0.104",
]

[tool.uv]
required-version = ">=0.13.7"

[tool.ruff]
# Markdown code blocks in specs and skills are sketches, not code to format.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Ruff >= 0.16 already enables about 400 rules by default (B, UP, RUF, SIM,
# FURB, PL, I, part of PT and TC). These turn rules of the coding skill into
# lint errors:
extend-select = [
    "ANN",     # every function annotated
    "ARG",     # unused arguments
    "BLE",     # no blind except
    "C90",     # functions too complex to review
    "EM",      # exception messages built before raise
    "FBT",     # no bool parameters
    "PLR2004", # thresholds are named constants
    "PT",      # all pytest-style rules
    "PTH",     # pathlib
    "RET",     # return consistency
    "T20",     # no print outside the CLI
    "TID251",  # banned APIs, below
    "TRY",     # raise from, no bare re-raise patterns
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "FBT"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Not needed on 3.14+: annotations are deferred (PEP 649/749)."

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ty.environment]
python-version = "3.15"

[tool.ty.rules]
all = "error"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
strict = true
timeout = "300"
# Every warning is an error, and with it the RuntimeWarning that CPython
# prints when an extension turns the GIL back on.
filterwarnings = ["error"]
markers = [
    "samples: needs the sample PDFs (found through GALLEY_SAMPLES or samples/ of the main checkout)",
    "tesseract: needs the tesseract binary",
    "pandoc: needs the pandoc binary",
]
